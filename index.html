/* ---- 계산 ---- */
const pick = (tiers, amt) => {
  for (let i = tiers.length - 1; i >= 0; i--) if (amt >= tiers[i].t) return tiers[i];
  return null;
};
const nextOf = (tiers, amt) => tiers.find((x) => amt < x.t) || null;

const fmt = (n) => Math.max(0, Math.round(n || 0)).toLocaleString("ko-KR");
const onlyDigits = (s) => (s || "").replace(/[^\d]/g, "");
const num = (s) => Number(onlyDigits(s)) || 0;
const man = (v) => (v / 10000).toLocaleString("ko-KR");

const C = {
  o700: "#C94400", o600: "#F26100", o500: "#FF8A3D", o200: "#FFCFA8", o100: "#FFE3CC", o50: "#FFF4EB",
  ink: "#1C1917", inkMid: "#57504A", inkSoft: "#6B635C", line: "#EADFD1", paper: "#FDF9F5",
  teal700: "#046B66", teal100: "#D5F0EE", gold: "#F5B93B", charcoal: "#241F1C", gray: "#A69C90",
};

const ScaleCtx = createContext(1);
const useF = () => { const s = useContext(ScaleCtx); return (n) => Math.round(n * s * 10) / 10; };

/* ---------------------- 아이콘 ---------------------- */
function Icon({ children, size = 24, color = "currentColor", strokeWidth = 2, style }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style}>{children}</svg>;
}
const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></Icon>;
const Check = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><path d="M9 12l2 2 4-4" /></Icon>;
const CircleI = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /></Icon>;
const Minus = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></Icon>;
const Type = (p) => <Icon {...p}><polyline points="4 7 4 4 20 4 20 7" /><line x1="9" y1="20" x2="15" y2="20" /><line x1="12" y1="4" x2="12" y2="20" /></Icon>;
const Refresh = (p) => <Icon {...p}><path d="M23 4v6h-6" /><path d="M1 20v-6h6" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10" /><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14" /></Icon>;
const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></Icon>;
const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9" /></Icon>;

/* ---------------------- 캐릭터 ---------------------- */
function FaceParts({ cx = 32, cy = 38, happy }) {
  return (<>
    <ellipse cx={cx - 6} cy={cy - 2} rx="2.6" ry="3.2" fill="#2B2320" />
    <ellipse cx={cx + 6} cy={cy - 2} rx="2.6" ry="3.2" fill="#2B2320" />
    <circle cx={cx - 5.2} cy={cy - 3.4} r="0.9" fill="#fff" />
    <circle cx={cx + 6.8} cy={cy - 3.4} r="0.9" fill="#fff" />
    <ellipse cx={cx - 11} cy={cy + 3.5} rx="3.4" ry="2.2" fill="#FFB48A" opacity="0.75" />
    <ellipse cx={cx + 11} cy={cy + 3.5} rx="3.4" ry="2.2" fill="#FFB48A" opacity="0.75" />
    <path d={happy ? `M${cx - 5} ${cy + 5} q5 6 10 0` : `M${cx - 4} ${cy + 5} q4 4 8 0`} stroke="#2B2320" strokeWidth="2.2" fill="none" strokeLinecap="round" />
  </>);
}
function MascotGuide({ size = 50, happy = false }) {
  return (<svg width={size} height={size} viewBox="0 0 64 64" style={{ display: "block", flexShrink: 0 }}>
    <ellipse cx="32" cy="58" rx="15" ry="3" fill="#000" opacity="0.07" />
    <circle cx="32" cy="39" r="17" fill="#FFF0E2" stroke="#F0C9A6" strokeWidth="1.5" />
    <FaceParts happy={happy} />
    <rect x="31" y="8" width="2" height="9" rx="1" fill="#C94400" />
    <path d="M11 22 a21 14 0 0 1 42 0 z" fill="#F26100" />
    <path d="M11 22 q5.25 5 10.5 0 q5.25 5 10.5 0 q5.25 5 10.5 0 q5.25 5 10.5 0" fill="#FF8A3D" />
  </svg>);
}
function MascotCoin({ size = 48 }) {
  return (<svg width={size} height={size} viewBox="0 0 64 64" style={{ display: "block", flexShrink: 0 }}>
    <circle cx="32" cy="34" r="22" fill="#F5B93B" /><circle cx="32" cy="34" r="17.5" fill="#FFD874" />
    <text x="32" y="26" textAnchor="middle" fontSize="11" fontWeight="900" fill="#B47A08">₩</text>
    <FaceParts cy={38} happy />
  </svg>);
}
function MascotGift({ size = 48 }) {
  return (<svg width={size} height={size} viewBox="0 0 64 64" style={{ display: "block", flexShrink: 0 }}>
    <rect x="12" y="24" width="40" height="30" rx="7" fill="#F26100" />
    <rect x="12" y="24" width="40" height="9" rx="4.5" fill="#FF8A3D" />
    <rect x="28.5" y="24" width="7" height="30" fill="#FFE3CC" opacity="0.9" />
    <path d="M32 24 q-9 -10 -14 -4 q-3 5 14 4" fill="#FFE3CC" />
    <path d="M32 24 q9 -10 14 -4 q3 5 -14 4" fill="#FFE3CC" />
    <FaceParts cy={43} happy />
  </svg>);
}

function Speech({ children, mascot, tone = "cream" }) {
  const f = useF();
  const bg = tone === "cream" ? C.o50 : "#fff";
  return (
    <div className="flex items-end gap-2" style={{ minWidth: 0 }}>
      <div style={{ flexShrink: 0 }}>{mascot}</div>
      <div className="relative rounded-2xl" style={{ padding: `${f(12)}px ${f(13)}px`, background: bg, border: `2px solid ${C.o200}`, flex: 1, minWidth: 0 }}>
        <span style={{ fontSize: f(14.5), fontWeight: 700, color: C.ink, lineHeight: 1.55, display: "block" }}>{children}</span>
        <span style={{ position: "absolute", left: -8, bottom: 15, width: 12, height: 12, background: bg, borderLeft: `2px solid ${C.o200}`, borderBottom: `2px solid ${C.o200}`, transform: "rotate(45deg)", borderRadius: 2 }} />
      </div>
    </div>
  );
}

/* ---------------------- 공통 UI ---------------------- */
function Card({ children, style }) {
  return <div className="rounded-3xl" style={{ padding: 20, background: "#fff", border: `1px solid ${C.line}`, boxShadow: "0 6px 20px rgba(201,68,0,0.07)", ...style }}>{children}</div>;
}
function Label({ children, style }) {
  const f = useF();
  return <p style={{ fontSize: f(17.5), fontWeight: 900, color: C.ink, letterSpacing: "-0.2px", ...style }}>{children}</p>;
}
function Note({ children, style }) {
  const f = useF();
  return <p style={{ fontSize: f(14.5), color: C.inkMid, lineHeight: 1.6, fontWeight: 600, ...style }}>{children}</p>;
}
function StepButton({ onClick, children, ariaLabel }) {
  const f = useF();
  return <button type="button" onClick={onClick} aria-label={ariaLabel} className="flex items-center justify-center rounded-2xl active:scale-95 transition-transform shrink-0"
    style={{ width: f(52), height: f(54), background: C.o50, color: C.o700, border: `2px solid ${C.o200}` }}>{children}</button>;
}
function CurrencyField({ value, onChange }) {
  const f = useF();
  return (
    <div className="flex items-center rounded-2xl px-3" style={{ border: `2px solid ${C.o200}`, background: "#fff", height: f(54), minWidth: 0 }}>

/* 입력값 조합으로 총 보상 계산 (b = 9/1~2, c = 9/3~4) */
function totalsOf(grade, b, c) {
  const a = b + c;
  const t1 = pick(A1[grade], a);
  const t2 = pick(A2[grade], b);
  const t3 = pick(A3, a);
  return { point: t1 ? t1.v : 0, cash: (t2 ? t2.v : 0) + (t3 ? t3.v : 0), gift: a >= A4.t };
}

/* ------------------------------ 본체 ------------------------------ */
function GyeonginiApp() {
  const [bigText, setBigText] = useState(false);
  const scale = bigText ? 1.16 : 1;
  const f = (n) => Math.round(n * scale * 10) / 10;

  const [code, setCode] = useState("");
  const [lookup, setLookup] = useState({ status: "idle", name: null, branch: null, code: null });
  const [grade, setGrade] = useState(null);          // "normal" | "premium"
  const [g12, setG12] = useState("");                // 9/1~9/2
  const [g34, setG34] = useState("");                // 9/3~9/4
  const [rulesOpen, setRulesOpen] = useState(false);
  const [shopOpen, setShopOpen] = useState(false);
  const [copied, setCopied] = useState(false);
  const [shareOpen, setShareOpen] = useState(false);
  const [shareBody, setShareBody] = useState("");
  const [flash, setFlash] = useState(false);
  const sumRef = React.useRef(null);

  /* 시뮬 반영 후 합계 카드로 이동 + 잠깐 강조 */
  const goToSummary = () => {
    setFlash(true);
    setTimeout(() => {
      if (sumRef.current && sumRef.current.scrollIntoView) {
        sumRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }, 60);
    setTimeout(() => setFlash(false), 2200);
  };

  const b = num(g12);          // 9/1~9/2 (시상 2에만 사용)
  const c = num(g34);          // 9/3~9/4
  const a = b + c;             // 9/1~9/4 합산 (시상 1·3·4에 사용)
  const open1 = true, open2 = true, open3 = true, open4 = true;

  const r = useMemo(() => {
    if (!grade) return null;
    const t1 = pick(A1[grade], a);
    const t2 = pick(A2[grade], b);
    const t3 = pick(A3, a);
    const g4 = a >= A4.t;
    return {
      p1: t1 ? t1.v : 0, n1: nextOf(A1[grade], a),
      c2: t2 ? t2.v : 0, n2: nextOf(A2[grade], b),
      c3: t3 ? t3.v : 0, n3: nextOf(A3, a),
      g4,
    };
  }, [grade, a, b]);

  // 일반 플래너일 때, 우수 플래너였다면 얼마나 더 받는지
  const upgrade = useMemo(() => {
    if (grade !== "normal") return null;
    const t1 = pick(A1.premium, a);
    const t2 = pick(A2.premium, b);
    const p = (t1 ? t1.v : 0), cash = (t2 ? t2.v : 0);
    return { point: p, cash, gainPoint: p - (r ? r.p1 : 0), gainCash: cash - (r ? r.c2 : 0) };
  }, [grade, a, b, r]);

  /* 목표를 조금만 올리면 얼마나 더 받는지 */
  const boost = useMemo(() => {
    if (!grade) return null;
    const base = totalsOf(grade, b, c);
    const cands = [];
    const upA = [...new Set([...A1[grade].map((x) => x.t), ...A3.map((x) => x.t), A4.t])];
    upA.forEach((T) => { if (a < T) cands.push({ cost: T - a, field: "c", next: c + (T - a), nb: b }); });
    A2[grade].forEach((x) => { if (b < x.t) cands.push({ cost: x.t - b, field: "b", next: b + (x.t - b), nb: x.t }); });
    const scored = cands.map((x) => {
      const t = x.field === "c" ? totalsOf(grade, b, c + x.cost) : totalsOf(grade, x.nb, c);
      return { ...x, dCash: t.cash - base.cash, dPoint: t.point - base.point, dGift: t.gift && !base.gift };
    }).filter((x) => x.dCash > 0 || x.dPoint > 0 || x.dGift);
    scored.sort((x, y) => x.cost - y.cost);
    return scored[0] || null;
  }, [grade, a, b, c]);

  const gradeGap = useMemo(() => {
    if (!grade || a + b === 0) return null;
    const n = totalsOf("normal", b, c), p = totalsOf("premium", b, c);

                    </div>

                    {/* 기간 주의 */}
                    <div className="rounded-3xl" style={{ marginTop: f(14), padding: f(18), background: "#FFF8E8", border: "2px solid #F5DFA8" }}>
                      <p style={{ fontSize: f(16), fontWeight: 900, color: "#8A6100" }}>시상별 기간이 달라요</p>
                      <div style={{ marginTop: f(8) }}>
                        {[["인보험 특차 기본시상", P.a1.label, open1], ["리딩플래너 시상", P.a2.label, open2], ["인보험 구간별 현금 추가시상", P.a3.label, open3], ["9월 누계 50만↑ 우대시상", P.a4.label, open4]].map(([t, p, o]) => (
                          <div key={t} style={{ padding: `${f(8)}px 0`, borderTop: `1px solid rgba(138,97,0,0.15)` }}>
                            <div className="flex items-center gap-2" style={{ minWidth: 0 }}>
                              <span style={{ fontSize: f(15), fontWeight: 900, color: o ? "#6B4C00" : C.gray }}>{t}</span>
                              {!o && <span className="rounded-full shrink-0" style={{ padding: `${f(3)}px ${f(8)}px`, background: "#E5DED5", color: C.inkSoft, fontSize: f(11.5), fontWeight: 800 }}>종료</span>}
                            </div>
                            <span style={{ display: "block", fontSize: f(14), fontWeight: 700, color: o ? "#8A6100" : C.gray, marginTop: 1 }}>{p}</span>
                          </div>
                        ))}
                      </div>
                      <p style={{ marginTop: f(8), fontSize: f(13.5), fontWeight: 700, color: "#8A6100", lineHeight: 1.6 }}>
                        시상마다 기간이 다르니,<br />기간에 맞는 실적으로 입력해 주세요.
                      </p>
                    </div>

                    {/* 규칙 */}
                    <div style={{ marginTop: f(14) }}>
                      <button onClick={() => setRulesOpen((v) => !v)} className="w-full flex items-center justify-between rounded-2xl"
                        style={{ padding: f(18), minHeight: f(60), background: "#fff", border: `1px solid ${C.line}` }}>
                        <span style={{ fontSize: f(17), fontWeight: 800, color: C.ink }}>시상 규칙 자세히 보기</span>
                        <ChevronDown size={f(24)} color={C.inkMid} style={{ transform: rulesOpen ? "rotate(180deg)" : "none", transition: "transform 200ms" }} />
                      </button>
                      {rulesOpen && (
                        <div className="rounded-2xl" style={{ marginTop: f(8), padding: f(18), background: "#fff", border: `1px solid ${C.line}` }}>
                          <RuleTable title="시상 1 · 인보험 특차 기본시상 (포인트)" period={P.a1.label}
                            rows={A1[grade].map((x) => [`${man(x.t)}만원`, `${x.v}포인트`])} sub={grade === "premium" ? "우수 플래너 기준" : "일반 플래너 기준"} />
                          <RuleTable title="시상 2 · 리딩플래너 시상 (현금)" period={P.a2.label}
                            rows={A2[grade].map((x) => [`${man(x.t)}만원`, `${man(x.v)}만원`])} sub={grade === "premium" ? "우수 플래너 기준" : "일반 플래너 기준"} />
                          <RuleTable title="시상 3 · 인보험 구간별 현금 추가시상" period={P.a3.label}
                            rows={A3.map((x) => [`${man(x.t)}만원`, `${man(x.v)}만원`])} sub="등급 구분 없음" />
                          <RuleTable title="시상 4 · 9월 누계 50만↑ 우대" period={P.a4.label}
                            rows={[["누계 50만원", A4.gift]]} sub="9월 인보험 누계 기준" last />
                          <p style={{ fontSize: f(13.5), fontWeight: 700, color: C.inkMid, lineHeight: 1.7 }}>
                            · 모든 구간은 누적이 아니라, 해당하는 구간 하나만 지급돼요.<br />
                            · 실적은 모두 인보험 기준이에요.
                          </p>
                        </div>
                      )}
                    </div>

                    <div className="flex items-center justify-center gap-2" style={{ marginTop: f(18) }}>
                      <MascotGuide size={f(40)} happy />
                      <p style={{ fontSize: f(13.5), color: "#9E948A", fontWeight: 700, lineHeight: 1.6 }}>
                        목표 실적으로 계산한 예상 금액이에요<br />실제 지급액은 최종 정산 기준에 따라 달라질 수 있어요
                      </p>
                    </div>
                  </>
                )}
              </>
            )}
          </main>
        </div>
      </div>
    </ScaleCtx.Provider>
  );
}

function RuleTable({ title, period, rows, sub, last }) {
  const f = useF();
  return (
    <div style={{ marginBottom: last ? f(14) : f(18) }}>
      <p style={{ fontSize: f(15.5), fontWeight: 900, color: C.o700 }}>{title}</p>
      <p style={{ fontSize: f(13), fontWeight: 700, color: C.inkMid, marginTop: 2 }}>{period} · {sub}</p>
      <div style={{ marginTop: f(6) }}>
        {rows.map(([l, rr], i) => (
          <div key={i} className="flex items-center justify-between gap-2" style={{ padding: `${f(6)}px 0`, borderTop: i === 0 ? "none" : `1px solid ${C.line}` }}>
            <span style={{ fontSize: f(14.5), fontWeight: 700, color: C.inkMid }}>{l}</span>
            <span style={{ fontSize: f(15.5), fontWeight: 900, color: C.ink }}>{rr}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GyeonginiApp />);
