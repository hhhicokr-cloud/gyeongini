<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>경인이 | 경인지역단 시상 가이드</title>
<meta name="description" content="플래너 코드를 넣으면 내 실적 진도와 시상금을 바로 알려드려요." />

<meta property="og:type" content="website" />
<meta property="og:title" content="경인이 | 11월 1주차 시상 가이드" />
<meta property="og:description" content="내 실적 진도와 10UP·20UP 목표, 받을 수 있는 시상금을 확인해보세요." />
<meta property="og:image" content="https://hhhicokr-cloud.github.io/gyeongini/og-image-11.png" />
<meta property="og:url" content="https://hhhicokr-cloud.github.io/gyeongini/" />
<meta name="twitter:card" content="summary_large_image" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
  *,::before,::after{box-sizing:border-box;border:0 solid;word-break:keep-all;overflow-wrap:break-word}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;line-height:1.5;background:#FDF9F5;overflow-x:hidden;
       font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  h1,h2,p{margin:0;font-size:inherit;font-weight:inherit}
  svg{display:block}
  .wrap{max-width:440px;width:100%;margin:0 auto;padding-bottom:40px}
  .head{background:linear-gradient(140deg,#FF8A3D 0%,#F26100 58%,#C94400 100%);
        padding:22px 18px 30px;border-bottom-left-radius:28px;border-bottom-right-radius:28px}
  .row{display:flex;align-items:center;gap:10px;min-width:0}
  .title{font-size:27px;font-weight:900;color:#fff;letter-spacing:-0.4px}
  .sub{font-size:14.5px;color:rgba(255,255,255,0.95);font-weight:700;margin-top:1px}
  .chip{display:inline-flex;align-items:center;margin-top:14px;padding:7px 13px;
        border-radius:9999px;background:rgba(255,255,255,0.24);font-size:14px;font-weight:800;color:#fff}
  main{padding:16px 14px 0}
  .card{background:#fff;border:1px solid #EADFD1;border-radius:24px;padding:26px 20px;text-align:center}
  .kicker{font-size:15px;font-weight:800;color:#6B635C}
  .big{font-size:32px;font-weight:900;color:#C94400;line-height:1.35;margin-top:10px}
  .dday{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:9999px;
        background:#F26100;color:#fff;font-size:17px;font-weight:900}
  .desc{font-size:16px;font-weight:700;color:#57504A;line-height:1.75;margin-top:18px}
  .box{margin-top:14px;padding:16px;border-radius:18px;background:#FFF4EB;border:1px solid #FFE3CC;text-align:left}
  .box h2{font-size:15px;font-weight:900;color:#C94400}
  .box p{font-size:14.5px;font-weight:700;color:#C94400;line-height:1.8;margin-top:6px}
  .foot{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px}
  .foot p{font-size:13.5px;color:#9E948A;font-weight:700;line-height:1.6;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="row">
      <svg width="54" height="54" viewBox="0 0 64 64" aria-hidden="true">
        <ellipse cx="32" cy="58" rx="15" ry="3" fill="#000" opacity="0.07"/>
        <circle cx="32" cy="39" r="17" fill="#FFF0E2" stroke="#F0C9A6" stroke-width="1.5"/>
        <ellipse cx="26" cy="36" rx="2.6" ry="3.2" fill="#2B2320"/>
        <ellipse cx="38" cy="36" rx="2.6" ry="3.2" fill="#2B2320"/>
        <circle cx="26.8" cy="34.6" r="0.9" fill="#fff"/>
        <circle cx="38.8" cy="34.6" r="0.9" fill="#fff"/>
        <ellipse cx="21" cy="41.5" rx="3.4" ry="2.2" fill="#FFB48A" opacity="0.75"/>
        <ellipse cx="43" cy="41.5" rx="3.4" ry="2.2" fill="#FFB48A" opacity="0.75"/>
        <path d="M27 43 q5 6 10 0" stroke="#2B2320" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <rect x="31" y="8" width="2" height="9" rx="1" fill="#C94400"/>
        <path d="M11 22 a21 14 0 0 1 42 0 z" fill="#F26100"/>
        <path d="M11 22 q5.25 5 10.5 0 q5.25 5 10.5 0 q5.25 5 10.5 0 q5.25 5 10.5 0" fill="#FF8A3D"/>
      </svg>
      <div style="min-width:0">
        <h1 class="title">경인이</h1>
        <p class="sub">11월 1주차 시상 가이드</p>
      </div>
    </div>
    <span class="chip">경인지역단 · 11/2(월) ~ 11/6(금)</span>
  </header>

  <main>
    <div class="card">
      <p class="kicker">준비 중이에요</p>
      <p class="big">11/3(화)<br>오픈 예정입니다!</p>
      <span class="dday" id="dday" style="display:none"></span>
      <p class="desc">
        조금만 기다려 주세요.<br>
        오픈하면 <b style="color:#C94400">플래너 코드</b>만 넣으시면<br>
        내 실적 진도와 받을 시상금을<br>
        바로 확인하실 수 있어요.
      </p>

      <div class="box">
        <h2>오픈하면 이런 걸 볼 수 있어요</h2>
        <p>
          · 내 실적이 지금 얼마인지<br>
          · 얼마를 더 하면 시상금이 얼마나 오르는지<br>
          · 브릿지 대상이면 얼마가 더 필요한지
        </p>
      </div>
    </div>

    <div class="foot">
      <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
        <ellipse cx="32" cy="58" rx="15" ry="3" fill="#000" opacity="0.07"/>
        <circle cx="32" cy="39" r="17" fill="#FFF0E2" stroke="#F0C9A6" stroke-width="1.5"/>
        <ellipse cx="26" cy="36" rx="2.6" ry="3.2" fill="#2B2320"/>
        <ellipse cx="38" cy="36" rx="2.6" ry="3.2" fill="#2B2320"/>
        <ellipse cx="21" cy="41.5" rx="3.4" ry="2.2" fill="#FFB48A" opacity="0.75"/>
        <ellipse cx="43" cy="41.5" rx="3.4" ry="2.2" fill="#FFB48A" opacity="0.75"/>
        <path d="M27 43 q5 6 10 0" stroke="#2B2320" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <rect x="31" y="8" width="2" height="9" rx="1" fill="#C94400"/>
        <path d="M11 22 a21 14 0 0 1 42 0 z" fill="#F26100"/>
        <path d="M11 22 q5.25 5 10.5 0 q5.25 5 10.5 0 q5.25 5 10.5 0 q5.25 5 10.5 0" fill="#FF8A3D"/>
      </svg>
      <p>곧 만나요!<br>경인지역단 드림</p>
    </div>
  </main>
</div>

<script>
  /* 남은 날짜 표시 — 오픈일(11/3) 전에만 보임 */
  try {
    var open = new Date(2026, 10, 3);          // 2026-11-03 (월은 0부터)
    var now  = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.round((open - today) / 86400000);
    var el = document.getElementById("dday");
    if (days > 0)      { el.textContent = days + "일 남았어요"; el.style.display = "inline-block"; }
    else if (days === 0) { el.textContent = "오늘 오픈합니다!"; el.style.display = "inline-block"; }
  } catch (e) {}
</script>
</body>
</html>
