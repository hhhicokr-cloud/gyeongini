/* ---- 계산 ---- */
const pick = (tiers, amt) => {
  for (let i = tiers.length - 1; i >= 0; i--) if (amt >= tiers[i].t) return tiers[i];
  return null;
};
const nextOf = (tiers, amt) => tiers.find((x) => amt < x.t) || null;

const fmt = (n) => Math.max(0, Math.round(n || 0)).toLocaleString("ko-KR");
const onlyDigits = (s) => (s || "").replace(/[^\d]/g, "");
const num = (s) => Number(onlyDigits(s)) || 0;
const man = (v) => (v / 10000).toLocaleString("ko-KR");

const C = {
  o700: "#C94400", o600: "#F26100", o500: "#FF8A3D", o200: "#FFCFA8", o100: "#FFE3CC", o50: "#FFF4EB",
  ink: "#1C1917", inkMid: "#57504A", inkSoft: "#6B635C", line: "#EADFD1", paper: "#FDF9F5",
  teal700: "#046B66", teal100: "#D5F0EE", gold: "#F5B93B", charcoal: "#241F1C", gray: "#A69C90",
};

const ScaleCtx = createContext(1);
const useF = () => { const s = useContext(ScaleCtx); return (n) => Math.round(n * s * 10) / 10; };

/* ---------------------- 아이콘 ---------------------- */
function Icon({ children, size = 24, color = "currentColor", strokeWidth = 2, style }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style}>{children}</svg>;
}
const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></Icon>;
const Check = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><path d="M9 12l2 2 4-4" /></Icon>;
const CircleI = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /></Icon>;
const Minus = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></Icon>;
const Type = (p) => <Icon {...p}><polyline points="4 7 4 4 20 4 20 7" /><line x1="9" y1="20" x2="15" y2="20" /><line x1="12" y1="4" x2="12" y2="20" /></Icon>;
const Refresh = (p) => <Icon {...p}><path d="M23 4v6h-6" /><path d="M1 20v-6h6" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10" /><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14" /></Icon>;
const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></Icon>;
const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9" /></Icon>;

/* ---------------------- 캐릭터 ---------------------- */
function FaceParts({ cx = 32, cy = 38, happy }) {
  return (<>
    <ellipse cx={cx - 6} cy={cy - 2} rx="2.6" ry="3.2" fill="#2B2320" />
    <ellipse cx={cx + 6} cy={cy - 2} rx="2.6" ry="3.2" fill="#2B2320" />

/* 입력값 조합으로 총 보상 계산 (b = 9/1~2, c = 9/3~4) */
function totalsOf(grade, a, isLead, w1) {
  const t1 = pick(A1[grade], a);
  const tb = isLead ? pick(A1_BONUS, a) : null;
  return { point: (t1 ? t1.v : 0) + (tb ? tb.v : 0), gift: (w1 || 0) + a >= A4.t };
}

/* ------------------------------ 본체 ------------------------------ */
function GyeonginiApp() {
  const [bigText, setBigText] = useState(false);
  const scale = bigText ? 1.16 : 1;
  const f = (n) => Math.round(n * scale * 10) / 10;

  const [code, setCode] = useState("");
  const [lookup, setLookup] = useState({ status: "idle", name: null, branch: null, code: null });
  const [grade, setGrade] = useState(null);          // "normal" | "premium"
  const [goal, setGoal] = useState("");              // 9/7~9/11
  const [rulesOpen, setRulesOpen] = useState(false);
  const [shopOpen, setShopOpen] = useState(false);
  const [copied, setCopied] = useState(false);
  const [shareOpen, setShareOpen] = useState(false);
  const [shareBody, setShareBody] = useState("");
  const [flash, setFlash] = useState(false);
  const [bridgeOpen, setBridgeOpen] = useState(false);
  const sumRef = React.useRef(null);

  /* 시뮬 반영 후 합계 카드로 이동 + 잠깐 강조 */
  const goToSummary = () => {
    setFlash(true);
    setTimeout(() => {
      if (sumRef.current && sumRef.current.scrollIntoView) {
        sumRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }, 60);
    setTimeout(() => setFlash(false), 2200);
  };

  const a = num(goal);         // 9/7~9/11 목표 인보험

  /* 1주차 실적 · 리딩 달성 여부 */
  const w1row = lookup.code ? WEEK1[lookup.code] : null;
  const w1 = w1row ? w1row[0] : 0;
  const isLead = w1row ? w1row[1] === 1 : false;

  /* 브릿지 시상 대상자 여부 */
  const brHC = lookup.code ? BRIDGE_HC[lookup.code] : null;                  // 10 / 20 / 30
  const isBridge = !!brHC;
  const open1 = true, open4 = true;

  const r = useMemo(() => {
    if (!grade) return null;
    const t1 = pick(A1[grade], a);
    const tb = isLead ? pick(A1_BONUS, a) : null;
    const base = t1 ? t1.v : 0, bonus = tb ? tb.v : 0;
    return { p1: base + bonus, pBase: base, pBonus: bonus, n1: nextOf(A1[grade], a), g4: w1 + a >= A4.t };
  }, [grade, a, isLead, w1]);

  // 일반 플래너일 때, 우수 플래너였다면 얼마나 더 받는지
  const upgrade = useMemo(() => {
    if (grade !== "normal") return null;
    const t1 = pick(A1.premium, a);
    const tb = isLead ? pick(A1_BONUS, a) : null;
    const p = (t1 ? t1.v : 0) + (tb ? tb.v : 0);
    return { point: p, cash: 0, gainPoint: p - (r ? r.p1 : 0), gainCash: 0 };
  }, [grade, a, r, isLead]);

  /* 목표를 조금만 올리면 얼마나 더 받는지 */
  const boost = useMemo(() => {
    if (!grade) return null;
    const base = totalsOf(grade, a, isLead, w1);
    const cands = [];
    const upA = [...new Set([...A1[grade].map((x) => x.t), Math.max(0, A4.t - w1)])];
    upA.forEach((T) => { if (a < T) cands.push({ cost: T - a }); });
    const scored = cands.map((x) => {
      const t = totalsOf(grade, a + x.cost, isLead, w1);
      return { ...x, dCash: 0, dPoint: t.point - base.point, dGift: t.gift && !base.gift };
    }).filter((x) => x.dPoint > 0 || x.dGift);
    scored.sort((x, y) => x.cost - y.cost);
    return scored[0] || null;
  }, [grade, a, isLead, w1]);

  /* 등급 차이 */
  const gradeGap = useMemo(() => {
    if (!grade || a === 0) return null;
    const n = totalsOf("normal", a, isLead, w1), p = totalsOf("premium", a, isLead, w1);
    return { dCash: 0, dPoint: p.point - n.point };
  }, [grade, a, isLead, w1]);

  const totalPoint = r ? r.p1 : 0;

                <div className="flex justify-center"><MascotGuide size={f(58)} happy /></div>
                <p style={{ marginTop: f(8), fontSize: f(13.5), fontWeight: 800, color: "rgba(255,255,255,0.9)" }}>{lookup.name}님은</p>
                <p style={{ fontSize: f(22), fontWeight: 900, color: "#fff", lineHeight: 1.3, marginTop: 2 }}>브릿지 시상 대상자예요!</p>
                <p style={{ fontSize: f(13.5), fontWeight: 700, color: "rgba(255,255,255,0.92)", marginTop: f(6), lineHeight: 1.6 }}>

                              +{boost.dPoint}<span style={{ fontSize: f(15) }}>P</span>
                            </span>
                          )}
                          {boost.dGift && (
                            <span className="rounded-full" style={{ padding: `${f(5)}px ${f(11)}px`, background: C.o50, color: C.o700, fontSize: f(13.5), fontWeight: 800 }}>소갈비 추가</span>
                          )}
                        </div>
                        <span style={{ display: "block", marginTop: f(6), fontSize: f(13), fontWeight: 700, color: C.o600 }}>눌러서 반영하기 · 위 시상금이 바뀌어요</span>
                      </button>
                    )}

                    {/* 우수 플래너 비교 */}
                    {upgrade && upgrade.gainPoint > 0 && (
                      <div className="rounded-3xl" style={{ marginTop: f(12), padding: f(18), background: C.teal100, border: "2px solid #B7E5E1" }}>
                        <div className="flex items-center gap-2">
                          <MascotCoin size={f(38)} />
                          <p style={{ fontSize: f(16), fontWeight: 900, color: C.teal700 }}>같은 실적인데, 20배수라면?</p>
                        </div>
                        <p style={{ marginTop: f(8), fontSize: f(14), fontWeight: 700, color: C.teal700, lineHeight: 1.6 }}>
                          실적을 더 하지 않아도,<br />하이캡 20배수 이상이면 이만큼 더 받아요.
                        </p>
                        <div style={{ marginTop: f(12), textAlign: "center" }}>
                          <span style={{ fontSize: f(13.5), fontWeight: 800, color: "rgba(4,107,102,0.75)" }}>포인트</span>
                          <p style={{ marginTop: 2, fontSize: f(34), fontWeight: 900, color: C.teal700, fontFeatureSettings: '"tnum"', lineHeight: 1.1 }}>
                            +{fmt(upgrade.gainPoint)}<span style={{ fontSize: f(18) }}> P</span>
                          </p>
                        </div>
                        <button type="button" onClick={() => { setGrade("premium"); goToSummary(); }} className="w-full rounded-2xl active:scale-[0.98] transition-transform"
                          style={{ marginTop: f(12), minHeight: f(50), background: C.teal700, color: "#fff", fontSize: f(15), fontWeight: 900 }}>
                          우수 플래너로 계산해 보기 ↑
                        </button>
                      </div>
                    )}

                    {/* 실적별 비교표 */}
                    <Card style={{ marginTop: f(14) }}>
                      <div className="flex items-center gap-2">
                        <MascotCoin size={f(38)} />
                        <Label>실적별로 얼마나 달라질까요?</Label>
                      </div>
                      <Note style={{ marginTop: f(5) }}>9/7~9/11 실적 기준이에요</Note>

                      <div style={{ marginTop: f(12) }}>
                        <div className="flex items-center" style={{ padding: `${f(8)}px ${f(6)}px`, background: "#FAF6F1", borderRadius: f(8) }}>
                          <span style={{ flex: 1, fontSize: f(13.5), fontWeight: 800, color: C.inkMid }}>인보험 실적</span>
                          <span style={{ flex: 1, fontSize: f(13.5), fontWeight: 800, color: C.inkMid, textAlign: "right" }}>포인트</span>
                        </div>
                        {[100000, 200000, 300000, 400000, 500000, 700000, 1000000].map((T) => {
                          const t1 = pick(A1[grade], T);
                          const tb = isLead ? pick(A1_BONUS, T) : null;
                          const pointv = (t1 ? t1.v : 0) + (tb ? tb.v : 0);
                          const mine = pick(A1[grade], a) && pick(A1[grade], a).t === T;
                          return (
                            <div key={T} className="flex items-center" style={{ padding: `${f(10)}px ${f(6)}px`, borderTop: `1px solid ${C.line}`, background: mine ? C.o50 : "transparent", borderRadius: mine ? f(8) : 0 }}>
                              <span style={{ flex: 1, fontSize: f(15), fontWeight: 900, color: mine ? C.o700 : C.ink }}>
                                {man(T)}만{mine && <span style={{ fontSize: f(11.5), fontWeight: 800 }}> 내 목표</span>}
                              </span>
                              <span style={{ flex: 1, fontSize: f(16), fontWeight: 900, color: mine ? C.o700 : "#B47A08", textAlign: "right", fontFeatureSettings: '"tnum"' }}>{pointv}P</span>
                            </div>
                          );
                        })}
                      </div>

                      <div className="rounded-2xl" style={{ marginTop: f(12), padding: f(13), background: "#FAF6F1", border: `1px solid ${C.line}` }}>
                        <Note>
                          {grade === "premium" ? "우수 플래너" : "일반 플래너"} 기준이에요.{isLead ? " 리딩 특별 추가 포인트가 포함된 금액이에요." : ""}
                        </Note>
                      </div>
                    </Card>

                    {/* 관리실적 주의 */}
                    <div className="rounded-3xl" style={{ marginTop: f(14), padding: f(18), background: "#FFF8E8", border: "2px solid #F5DFA8" }}>
                      <div className="flex items-center gap-2">
                        <MascotGuide size={f(38)} />
                        <p style={{ fontSize: f(16), fontWeight: 900, color: "#8A6100" }}>실적 기준을 꼭 확인해 주세요</p>
                      </div>
                      <div style={{ marginTop: f(10) }}>
                        <div style={{ padding: `${f(8)}px 0`, borderTop: "1px solid rgba(138,97,0,0.15)" }}>
                          <span style={{ fontSize: f(14.5), fontWeight: 900, color: "#6B4C00" }}>시상 1 · 인보험 2차 기본시상</span>
                          <span style={{ display: "block", fontSize: f(14), fontWeight: 700, color: "#8A6100", marginTop: 1 }}>관리실적 기준</span>
                        </div>
                        {isBridge && brHC && (
                          <div style={{ padding: `${f(8)}px 0`, borderTop: "1px solid rgba(138,97,0,0.15)" }}>
                            <span style={{ fontSize: f(14.5), fontWeight: 900, color: "#6B4C00" }}>고하이캡 브릿지 시상</span>
                            <span style={{ display: "block", fontSize: f(14), fontWeight: 700, color: "#8A6100", marginTop: 1 }}>관리실적 기준</span>
                          </div>
                        )}
                      </div>
                      <div className="rounded-2xl" style={{ marginTop: f(10), padding: f(13), background: "rgba(255,255,255,0.7)" }}>
                        <p style={{ fontSize: f(13.5), fontWeight: 700, color: "#6B4C00", lineHeight: 1.7 }}>
                          위 두 시상은 관리사항이 적용된 실적으로 산정돼요.<br />
                          <b>집중관리계약, 본인계약, 실손 등 일부 계약</b>은 실적에서 빠지기 때문에,<br />
                          플래너님이 알고 계신 실적과 차이가 날 수 있습니다.
                        </p>
                      </div>
                    </div>

                    {/* 기간 주의 */}
                    <div className="rounded-3xl" style={{ marginTop: f(14), padding: f(18), background: "#FFF8E8", border: "2px solid #F5DFA8" }}>
                      <p style={{ fontSize: f(16), fontWeight: 900, color: "#8A6100" }}>시상별 기간이 달라요</p>
                      <div style={{ marginTop: f(8) }}>
                        {[["인보험 2차 기본시상", P.a1.label, open1], ["9월 누계 50만↑ 우대시상", P.a4.label, open4]].map(([t, p, o]) => (
                          <div key={t} style={{ padding: `${f(8)}px 0`, borderTop: `1px solid rgba(138,97,0,0.15)` }}>
                            <div className="flex items-center gap-2" style={{ minWidth: 0 }}>
                              <span style={{ fontSize: f(15), fontWeight: 900, color: o ? "#6B4C00" : C.gray }}>{t}</span>
                              {!o && <span className="rounded-full shrink-0" style={{ padding: `${f(3)}px ${f(8)}px`, background: "#E5DED5", color: C.inkSoft, fontSize: f(11.5), fontWeight: 800 }}>종료</span>}
                            </div>
                            <span style={{ display: "block", fontSize: f(14), fontWeight: 700, color: o ? "#8A6100" : C.gray, marginTop: 1 }}>{p}</span>
                          </div>
                        ))}
                      </div>
                      <p style={{ marginTop: f(8), fontSize: f(13.5), fontWeight: 700, color: "#8A6100", lineHeight: 1.6 }}>
                        시상마다 기간이 다르니,<br />기간에 맞는 실적으로 입력해 주세요.
                      </p>
                    </div>

                    {/* 규칙 */}
                    <div style={{ marginTop: f(14) }}>
                      <button onClick={() => setRulesOpen((v) => !v)} className="w-full flex items-center justify-between rounded-2xl"
                        style={{ padding: f(18), minHeight: f(60), background: "#fff", border: `1px solid ${C.line}` }}>
                        <span style={{ fontSize: f(17), fontWeight: 800, color: C.ink }}>시상 규칙 자세히 보기</span>
                        <ChevronDown size={f(24)} color={C.inkMid} style={{ transform: rulesOpen ? "rotate(180deg)" : "none", transition: "transform 200ms" }} />
                      </button>
                      {rulesOpen && (
                        <div className="rounded-2xl" style={{ marginTop: f(8), padding: f(18), background: "#fff", border: `1px solid ${C.line}` }}>
                          <RuleTable title="시상 1 · 인보험 2차 기본시상 (포인트)" period={P.a1.label}
                            rows={A1[grade].map((x) => [`${man(x.t)}만원`, `${x.v}포인트`])} sub={grade === "premium" ? "우수 플래너 기준" : "일반 플래너 기준"} />
                          {isLead && (
                            <RuleTable title="1주차 리딩 달성자 한정 특별 추가" period={P.a1.label}
                              rows={A1_BONUS.map((x) => [`${man(x.t)}만원`, `+${x.v}포인트`])} sub="시상 1에 더해서 지급" />
                          )}
                          <RuleTable title="시상 2 · 9월 누계 50만↑ 우대" period={P.a4.label}
                            rows={[["누계 50만원", A4.gift]]} sub="1주차 실적 + 이번 주 실적 합산" last />
                          <p style={{ fontSize: f(13.5), fontWeight: 700, color: C.inkMid, lineHeight: 1.7 }}>
                            · 모든 구간은 누적이 아니라, 해당하는 구간 하나만 지급돼요.<br />
                            · 실적은 모두 인보험 기준이에요.
                          </p>
                        </div>
                      )}
                    </div>

                    <div className="flex items-center justify-center gap-2" style={{ marginTop: f(18) }}>
                      <MascotGuide size={f(40)} happy />
                      <p style={{ fontSize: f(13.5), color: "#9E948A", fontWeight: 700, lineHeight: 1.6 }}>
                        목표 실적으로 계산한 예상 금액이에요<br />실제 지급액은 최종 정산 기준에 따라 달라질 수 있어요
                      </p>
                    </div>
                  </>
                )}
              </>
            )}
          </main>
        </div>
      </div>
    </ScaleCtx.Provider>
  );
}

function RuleTable({ title, period, rows, sub, last }) {
  const f = useF();
  return (
    <div style={{ marginBottom: last ? f(14) : f(18) }}>
      <p style={{ fontSize: f(15.5), fontWeight: 900, color: C.o700 }}>{title}</p>
      <p style={{ fontSize: f(13), fontWeight: 700, color: C.inkMid, marginTop: 2 }}>{period} · {sub}</p>
      <div style={{ marginTop: f(6) }}>
        {rows.map(([l, rr], i) => (
          <div key={i} className="flex items-center justify-between gap-2" style={{ padding: `${f(6)}px 0`, borderTop: i === 0 ? "none" : `1px solid ${C.line}` }}>
            <span style={{ fontSize: f(14.5), fontWeight: 700, color: C.inkMid }}>{l}</span>
            <span style={{ fontSize: f(15.5), fontWeight: 900, color: C.ink }}>{rr}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GyeonginiApp />);
</script>
